name: RHEOMac
options:
  bundleIdPrefix: com.arminkao
  developmentLanguage: zh-Hant
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: GHCWJ24V46
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ALWAYS_SEARCH_USER_PATHS: NO
targets:
  RHEOMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: RHEO
        PRODUCT_BUNDLE_IDENTIFIER: com.arminkao.rheo.mac   # iOS 那顆 com.arminkao.rheo 已註冊 App ID，桌面版另立
        INFOPLIST_KEY_CFBundleDisplayName: RHEO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
